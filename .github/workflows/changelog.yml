name: Sync Public Changelog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-sync-main
  cancel-in-progress: false

jobs:
  sync-changelog:
    name: Sync Merged PRs into Canonical Changelog
    runs-on: ubuntu-latest
    # Never trigger recursively on automated changelog sync commits
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'chore(changelog):') &&
       !contains(github.event.head_commit.message, '[skip changelog]'))
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Sync changelog.json from merged GitHub PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_changelog.py --from-github
          python3 scripts/update_changelog.py --check

      - name: Open or update changelog sync PR if changed
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet src/aiwatchdogs/hub/changelog.json web/src/lib/changelog.json; then
            echo "Changelog is already up to date with main."
            exit 0
          fi

          BRANCH="chore/auto-changelog-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add src/aiwatchdogs/hub/changelog.json web/src/lib/changelog.json
          git commit -m "chore(changelog): sync merged PRs"
          git fetch origin "$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "$BRANCH"

          EXISTING_PR=$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing changelog sync PR #$EXISTING_PR."
          else
            set +e
            CREATE_OUT=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(changelog): sync merged PRs" \
              --body "Automated changelog sync generated by \`.github/workflows/changelog.yml\` from merged pull requests targeting \`main\`. Keeps \`src/aiwatchdogs/hub/changelog.json\` and \`web/src/lib/changelog.json\` in exact parity." 2>&1)
            CREATE_EXIT=$?
            set -e
            echo "$CREATE_OUT"
            if [ "$CREATE_EXIT" -ne 0 ]; then
              if echo "$CREATE_OUT" | grep -qi "not permitted to create or approve pull requests"; then
                COMPARE_URL="https://github.com/${{ github.repository }}/compare/main...${BRANCH}?expand=1"
                echo "::warning title=Changelog branch synced; org blocks Actions PR creation::Synced branch '${BRANCH}' was pushed. Open the PR manually at ${COMPARE_URL} or enable 'Allow GitHub Actions to create and approve pull requests' in organization Actions settings (or add a CHANGELOG_BOT_TOKEN secret)."
                exit 0
              fi
              exit "$CREATE_EXIT"
            fi
          fi
