name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.14, Locked Deps & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Verify lockfile consistency & install dependencies
        run: uv sync --locked

      - name: Run unit, hub, CLI, and audit regression suite
        run: uv run pytest -v

      - name: Validate project files (projects/*.json)
        run: uv run aiwatchdogs project validate

      - name: Verify canonical changelog JSON parity & schema
        run: python3 scripts/update_changelog.py --check

      - name: Validate rendered /join.sh POSIX syntax & pinned git install
        run: |
          uv run python -c "from aiwatchdogs.hub.templates import render_join_sh; s = render_join_sh('https://aiwatchdogs.in'); assert 'git+https://github.com/aiwatchdogsindia/aiwatchdogs.in.git' in s and 'uvx aiwatchdogs' not in s and 'exec </dev/tty' in s; print(s)" | sh -n

  python-minimum-version:
    name: Python 3.11 (minimum supported) Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies on the lowest requires-python
        run: uv sync --locked

      - name: Run the test suite on Python 3.11
        run: uv run pytest -q

  postgres-integration:
    name: PostgreSQL 16 Migrations & Concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiwatchdogs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aiwatchdogs_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Run real PostgreSQL migration & concurrency tests
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/aiwatchdogs_test
        run: uv run pytest -v tests/test_postgres_integration.py tests/test_purge_legacy.py tests/test_project_upgrade_backends.py

  web-build:
    name: Web Dashboard Typecheck & Build (Node 26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies, typecheck, and build
        run: npm ci && npx tsc --noEmit && npm run build

  security-audit:
    name: Dependency Security Audit (pip-audit & npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Setup Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Audit Python locked dependencies (pip-audit)
        shell: bash
        run: uvx pip-audit -r <(uv export --format requirements-txt --no-hashes --no-emit-project)

      - name: Audit web npm dependencies (npm audit)
        working-directory: web
        run: npm audit --audit-level=moderate

  container-smoke:
    name: Docker Build & /health Startup Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Dockerfile pins base images and has no missing datasets/ copy
        run: |
          ! grep -E '^FROM .*:latest' Dockerfile
          ! grep -E 'uv:latest' Dockerfile
          ! grep -E 'COPY[[:space:]]+datasets/' Dockerfile

      - name: Build production Docker image
        run: docker build -t aiwatchdogs-hub:ci .

      - name: Boot container and verify /health db_ok & /join.sh
        run: |
          docker run -d --name awd-ci-hub -p 18000:8000 aiwatchdogs-hub:ci
          trap 'docker logs awd-ci-hub || true; docker rm -f awd-ci-hub || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/health | grep -q '"db_ok":true'; then
              curl -fsS http://127.0.0.1:18000/join.sh | sh -n
              exit 0
            fi
            sleep 1
          done
          echo "Container failed /health readiness check"
          exit 1
