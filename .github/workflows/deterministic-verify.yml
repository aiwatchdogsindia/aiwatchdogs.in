name: Deterministic Release Verification

on:
  pull_request:
    paths:
      - "src/aiwatchdogs/engines/**"
      - "src/aiwatchdogs/projects.py"
      - "src/aiwatchdogs/cli/main.py"
      - "projects/**"
      - ".github/workflows/deterministic-verify.yml"
  push:
    branches: [main]
    paths:
      - "src/aiwatchdogs/engines/**"
      - "src/aiwatchdogs/projects.py"
      - "src/aiwatchdogs/cli/main.py"
      - "projects/**"
      - ".github/workflows/deterministic-verify.yml"
  workflow_dispatch:
    inputs:
      project:
        description: "Optional project slug (blank = all active projects)"
        required: false
        default: ""
      execute_live:
        description: "Download & execute live pinned official datasets (true/false)"
        required: false
        default: "false"
      live_limit:
        description: "Max live tasks per project when execute_live=true"
        required: false
        default: "2"
  schedule:
    # Weekly reproducible verification of all pinned project manifests & deterministic engine outputs
    - cron: "30 2 * * 0"

permissions:
  contents: read

jobs:
  deterministic-manifest:
    name: Execute Deterministic Engines & Publish Release Fingerprint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate all project manifests
        run: uv run aiwatchdogs project validate

      - name: Execute deterministic engine suite & verify repeatable outputs
        run: |
          ARGS=()
          if [ -n "${{ inputs.project }}" ]; then
            ARGS+=(--project "${{ inputs.project }}")
          fi
          if [ "${{ inputs.execute_live }}" = "true" ]; then
            ARGS+=(--execute-live --live-limit "${{ inputs.live_limit || '2' }}")
          fi
          uv run aiwatchdogs reproduce "${ARGS[@]}" --json-out release-verification-hash-1.json
          uv run aiwatchdogs reproduce "${ARGS[@]}" --json-out release-verification-hash-2.json
          diff -u release-verification-hash-1.json release-verification-hash-2.json
          mv release-verification-hash-1.json release-verification-hash.json
          rm -f release-verification-hash-2.json
          cat release-verification-hash.json

      - name: Upload release verification fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-hash
          path: release-verification-hash.json
          retention-days: 90
