services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiwatchdogs-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIWATCHDOGS_PORT:-8000}:8000"
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    environment:
      AIWATCHDOGS_DB_PATH: /app/data/aiwatchdogs.db
      AIWATCHDOGS_WEB_DIST: /app/web/dist
      AIWATCHDOGS_HOST: 0.0.0.0
      AIWATCHDOGS_PORT: 8000
      AIWATCHDOGS_PUBLIC_URL: ${AIWATCHDOGS_PUBLIC_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL:-}
      AIWATCHDOGS_REQUIRE_POSTGRES: ${AIWATCHDOGS_REQUIRE_POSTGRES:-0}
      AIWATCHDOGS_PLAIN_WRITER: ${AIWATCHDOGS_PLAIN_WRITER:-}
      AIWATCHDOGS_PLAIN_MODEL: ${AIWATCHDOGS_PLAIN_MODEL:-}
      AIWATCHDOGS_PLAIN_EFFORT: ${AIWATCHDOGS_PLAIN_EFFORT:-low}
      AIWATCHDOGS_PLAIN_DAILY_BUDGET_USD: ${AIWATCHDOGS_PLAIN_DAILY_BUDGET_USD:-2}
      AIWATCHDOGS_PLAIN_SECRET: ${AIWATCHDOGS_PLAIN_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    volumes:
      - aiwatchdogs_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); d = json.loads(r.read().decode()); sys.exit(0 if r.status == 200 and d.get('db_ok') is True and d.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Optional automatic HTTPS reverse proxy for production deployment at aiwatchdogs.in
  # Start with: docker compose --profile tls up -d --build
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: aiwatchdogs-caddy
    profiles: ["tls", "prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - backend
      - edge
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    pids_limit: 256
    mem_limit: 256m
    cpus: "1.0"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      hub:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.12.6
    container_name: aiwatchdogs-ollama
    profiles: ["model"]
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    cpus: "4.0"
    volumes:
      - ollama_models:/root/.ollama

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge

volumes:
  ollama_models:
  aiwatchdogs_data:
  caddy_data:
  caddy_config:
