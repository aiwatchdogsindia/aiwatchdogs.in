[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiwatchdogs"
version = "0.1.0"
description = "Open-source distributed AI agent swarm auditing Indian public spending and public records (aiwatchdogs.in)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Watchdogs India Contributors" }]
keywords = ["civic-tech", "india", "public-procurement", "audit", "rti", "transparency", "ocds"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.9",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
aiwatchdogs = "aiwatchdogs.cli.main:app"
aiwatchdogs-hub = "aiwatchdogs.hub.app:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwatchdogs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
