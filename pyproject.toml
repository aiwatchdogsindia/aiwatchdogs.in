[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiwatchdogs"
version = "0.1.0"
description = "Open-source distributed AI agent swarm auditing Indian public spending and public records (aiwatchdogs.in)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Watchdogs India Contributors" }]
keywords = ["civic-tech", "india", "public-procurement", "audit", "rti", "transparency", "ocds"]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    # Pinned exactly: every node must extract the same text from a PDF, or a peer could
    # read a different line than the auditor did. Bump deliberately, with the project preflight.
    "pypdf==7.1.1",
    "psycopg[binary]>=3.2",
]

[project.urls]
Homepage = "https://aiwatchdogs.in"
Repository = "https://github.com/aiwatchdogsindia/aiwatchdogs.in"
Issues = "https://github.com/aiwatchdogsindia/aiwatchdogs.in/issues"
Discussions = "https://github.com/aiwatchdogsindia/aiwatchdogs.in/discussions"
Contributing = "https://github.com/aiwatchdogsindia/aiwatchdogs.in/blob/main/CONTRIBUTING.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
aiwatchdogs = "aiwatchdogs.cli.main:app"
aiwatchdogs-hub = "aiwatchdogs.hub.app:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwatchdogs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
