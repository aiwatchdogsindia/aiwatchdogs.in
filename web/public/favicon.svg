<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Watchdogs India">
  <title>AI Watchdogs India</title>
  <!-- Archival paper shield silhouette for crisp light & dark tab contrast -->
  <path d="M 32 5 L 55 13.5 L 53.5 38.5 Q 52.5 50.5 32 59.5 Q 11.5 50.5 10.5 38.5 L 9 13.5 Z" fill="#FFFFFF"/>
  <!-- Bold tricolor architectural shield rim with pointed heraldic base -->
  <path d="M 9 13.5 L 32 5 L 55 13.5" fill="none" stroke="#FF9933" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 10.5 38.5 Q 11.5 50.5 32 59.5" fill="none" stroke="#138808" stroke-width="5.2" stroke-linecap="round"/>
  <path d="M 53.5 38.5 Q 52.5 50.5 32 59.5" fill="none" stroke="#138808" stroke-width="5.2" stroke-linecap="round"/>
  <line x1="9" y1="13.5" x2="10.5" y2="38.5" stroke="#0A0F3C" stroke-width="5.2" stroke-linecap="round"/>
  <line x1="55" y1="13.5" x2="53.5" y2="38.5" stroke="#0A0F3C" stroke-width="5.2" stroke-linecap="round"/>
  <!-- Anchor sovereign crown & apex dots -->
  <circle cx="32" cy="5.5" r="3.4" fill="#FF9933"/>
  <circle cx="32" cy="59.0" r="3.4" fill="#138808"/>
  <!-- Bold vigilant eye + Chakra Navy iris -->
  <path d="M 14.5 32 C 22 19.5, 42 19.5, 49.5 32 C 42 44.5, 22 44.5, 14.5 32 Z" fill="#0A0F3C"/>
  <circle cx="32" cy="32" r="10.2" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="7.4" fill="none" stroke="#000080" stroke-width="3.8"/>
  <circle cx="32" cy="32" r="2.7" fill="#000080"/>
</svg>
